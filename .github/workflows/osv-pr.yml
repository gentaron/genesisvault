# Hyperfleet: independent free OSS scan in the target repository only.
# No agent, API key, GPU, paid cloud provider, or deploy step.
name: OSS dependency vulnerability check
on:
  pull_request:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  dependency-audit:
    if: github.event.repository.private == false
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.1
