name: Secret history scan
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: '44 8 * * 4'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.4'
          cache: false
      - name: Build pinned scanner outside the repository
        working-directory: ${{ runner.temp }}
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          GOFLAGS: ''
        run: go install github.com/zricethezav/gitleaks/v8@6eaad039603a4de39fddd1cf5f727391efe9974e
      - name: Scan fetched history (redacted)
        env:
          GITLEAKS_CONFIG: ''
          GITLEAKS_CONFIG_TOML: ''
        run: |
          # note.com から同期した記事の frontmatter にある `key: n<12桁の16進>` は公開記事の ID（URL にも出る）。
          # generic-api-key が誤検出するので、その1パターンだけを、その場所でだけ除外する。
          cat > "$RUNNER_TEMP/security-gitleaks.toml" <<'TOML'
          [extend]
          useDefault = true

          [[allowlists]]
          description = "note.com article IDs in synced vault notes (public, also in the URL)"
          condition = "AND"
          paths = ['''^data/vault/note/[^/]+\.md$''']
          regexes = ['''^n[0-9a-f]{12}$''']
          TOML
          sed -i 's/^          //' "$RUNNER_TEMP/security-gitleaks.toml"
          touch "$RUNNER_TEMP/security-gitleaks.ignore"
          rm -f .gitleaksignore
          "$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all" --redact=100 --no-banner --ignore-gitleaks-allow --config="$RUNNER_TEMP/security-gitleaks.toml" --gitleaks-ignore-path="$RUNNER_TEMP/security-gitleaks.ignore"
