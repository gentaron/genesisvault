name: CI — Verify Gate

# Phase κ — the deterministic gate.
#
# Everything this workflow runs is reproducible offline: no LLM call, no
# API key, no network beyond `bun install`. It is byte-for-byte the same
# command a human runs locally (`bun run verify`), so "green on my
# machine" and "green in CI" mean the same thing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Deterministic Verify Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Install dependencies
        run: bun install

      - name: Run verify gate
        run: bun run verify
