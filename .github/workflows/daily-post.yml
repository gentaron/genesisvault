name: Genesis Vault — Multi-Agent Daily Post

on:
  schedule:
    # 毎日午後7時30分(MYT/UTC+8)に実行 = UTC 11:30
    - cron: '30 11 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write
  # GitHub Models の無料枠を GITHUB_TOKEN だけで呼ぶため（登録する鍵が増えない）
  models: read

jobs:
  create-post:
    runs-on: ubuntu-latest

    # Bound at job level so a step's `if:` can test whether the optional
    # cross-repo token exists — the `secrets` context is not available in
    # `if`, but `env` is.
    env:
      VAIZ_DISPATCH_TOKEN: ${{ secrets.VAIZ_DISPATCH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # package.json の packageManager（bun@1.3.12）に合わせる。'1' だと最新の
          # 1.x が入り、bun.lock を書き換えて作業ツリーを汚す（#246 の遠因）。
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      # IDEAZ の型（memory/）と公開済み見出しを取り寄せ直す。取れなければ写しのまま。
      - name: Sync IDEAZ format
        continue-on-error: true
        run: bun scripts/sync-ideaz.mjs

      # 今日の記事が既にある日（手動実行の後など）も 0 秒で抜けない。二重投稿だけを止め、
      # Tessa・Kaia・台帳・Juno の選定・Clef の事後審査は毎回通す（観測モード）。
      # 全工程の ✅/⚠️/❌/⏭️ と理由は Job Summary に表で出る。
      - name: Run Multi-Agent Pipeline (Tessa → Kaia → Juno[Clef] → Lena → Sophia[IDEAZ] → Iris → Clef審査)
        env:
          # GitHub Models（無料）。Actions に最初からある token。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Jev（判断AI）を Cloudflare Workers AI の無料枠で。無ければ選定は LLM → 記号へ縮退。
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # QAIZ をデプロイした URL（例: https://qaiz.<account>.workers.dev）。秘密ではないので Variables 側。
          QAIZ_BASE_URL: ${{ vars.QAIZ_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PUBLIC_SENTRY_DSN: ${{ secrets.PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PUBLIC_GIT_SHA: ${{ github.sha }}
          NODE_ENV: production
        run: bun scripts/auto-post.mjs

      # Phase κ — deterministic gate on generated output. Runs with no LLM
      # and no API key, so a bad generation is caught by a rule before it
      # is ever committed, not by a reader after it ships.
      - name: Verify generated post (deterministic, no LLM)
        run: bun run verify:quick

      # 台帳とトレンドのスナップショットも一緒にコミットする。
      # ランナーは毎回まっさらなチェックアウトなので、ここで押さないと
      # 「到達点の記録」が毎晩捨てられ、継続性の正典が数週間前で凍る（LM-013）。
      - name: Commit and push new post + telemetry + continuity ledger
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Mina Eureka Ernst [Bot]"
          git add src/content/posts/*.md docs/agent-runs/ data/continuity-ledger.json data/trend-radar.json
          # 財務パルス（変化率のみ）・選定ログ・IDEAZ の型の写しも。ランナーは毎回まっさらなので押さないと消える（LM-013）。
          # 1つでも無いパスがあると git add 全体が失敗するので、在るものだけを1つずつ。
          for p in data/finance-pulse.json data/published-titles.json docs/selection-runs docs/gate-runs prompts/ideaz; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          # 見るのはステージ済みの差分だけ。未ステージの変更（bun install が書き換えた
          # bun.lock など）で「変更あり」と判断すると、記事を書かなかった日に空の
          # git commit が走って失敗する（2026-10-11 の手動再実行 #246 で発生）。
          if git diff --staged --quiet; then
            echo "変更なし — コミットしません"
          else
            # 観測モードの日は記事を書いていない。コミット名で区別する。
            if git diff --staged --name-only | grep -q '^src/content/posts/'; then
              msg="New post: $(date +'%Y-%m-%d') — Multi-Agent AI Pipeline"
            else
              msg="chore: 観測ログ $(date +'%Y-%m-%d') — 財務パルス・選定・Clef 審査"
            fi
            git commit -m "$msg"
            # 同時刻に別の実行が押していても落ちないよう、1回だけ取り込み直して押す。
            git push || (git pull --rebase && git push)
          fi

      # ── Phase μ — hand the article to VAIZ through Linear ──────
      #
      # VE-009 turns the article into a short-video brief and files it as
      # a Linear issue in Todo + agent-ready; VAIZ's video-loop claims it
      # and attaches the rendered video back onto the same issue.
      #
      # continue-on-error: the article is already written, verified and
      # pushed by this point. A Linear outage must not turn a good post
      # into a red build. The script itself refuses to file a brief that
      # fails its checks, so "no issue" is always the safe outcome.
      - name: File a video brief in Linear (VE-009 Runa)
        id: brief
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bun run video:brief

      # Runs unconditionally because the ledger is written on two paths:
      # a new brief, and the repair path where an issue already existed in
      # Linear but the ledger had lost it. `git diff --staged --quiet`
      # makes this a no-op the rest of the time.
      #
      # ISSUE_KEY goes through env rather than `${{ }}` inside the script:
      # it is a value returned by an external API, and interpolating one
      # straight into a shell line is how that API gets to run commands.
      - name: Commit the brief ledger
        if: always()
        env:
          ISSUE_KEY: ${{ steps.brief.outputs.issue_key }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Mina Eureka Ernst [Bot]"
          git add data/video-briefs.json
          git diff --staged --quiet || (git commit -m "chore: 動画ブリーフ台帳を更新${ISSUE_KEY:+ (${ISSUE_KEY})}" && git push)

      # Optional: wake VAIZ immediately instead of waiting for its 22:00
      # UTC cron. Without VAIZ_DISPATCH_TOKEN this step is skipped and the
      # cron still picks the brief up — the nudge is an optimisation, not
      # a dependency.
      # 黙って skipped にしない。飛ばした理由を Job Summary に書く。
      - name: Explain why VAIZ nudge is skipped
        if: steps.brief.outputs.created != 'true' || env.VAIZ_DISPATCH_TOKEN == ''
        env:
          CREATED: ${{ steps.brief.outputs.created }}
        run: |
          if [ "$CREATED" != "true" ]; then
            reason="新しい動画ブリーフが無い（既に Linear へ送信済み、または今日は記事を書いていない）"
          else
            reason="VAIZ_DISPATCH_TOKEN が未設定（VAIZ は 22:00 UTC の定期実行で拾うので実害なし）"
          fi
          echo "⏭️ VAIZ への即時通知: $reason"
          echo "- ⏭️ VAIZ への即時通知: $reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Nudge VAIZ to pick it up now
        if: steps.brief.outputs.created == 'true' && env.VAIZ_DISPATCH_TOKEN != ''
        run: |
          set -euo pipefail
          curl -sS -f -X POST \
            -H "Authorization: Bearer $VAIZ_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository_owner }}/VAIZ/dispatches \
            -d '{"event_type":"video-brief-ready"}'
          echo "Dispatched video-brief-ready to VAIZ."
